name: Publish

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Build installer
        run: make build-installer IMG=ghcr.io/toandos/stalwart-operator:{{ inputs.version }}

      - name: Generate helm chart
        run: kubebuilder edit --plugins=helm/v2-alpha

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: |
          helm package ./dist/chart \
            --version "${{ inputs.version }}" \
            --app-version "${{ inputs.version }}"

      - name: Push Helm chart
        run: |
          helm push \
            "stalwart-operator-${{ inputs.version }}.tgz" \
            oci://ghcr.io/toandos/charts